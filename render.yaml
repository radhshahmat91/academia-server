services:
  - type: web
    name: academiaconnect-server
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: academiaconnect
      - key: CLIENT_URL
        sync: false
      - key: AUTH_URL
        sync: false
